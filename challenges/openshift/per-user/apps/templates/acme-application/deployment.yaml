kind: Deployment
apiVersion: apps/v1
metadata:
  name: acme-application
  namespace: {{ .Values.namespacePermissions.user }}-apps
  labels:
    app: acme-application
    app.kubernetes.io/component: acme-application
    app.kubernetes.io/instance: acme-application
    app.kubernetes.io/name: acme-application
    app.kubernetes.io/part-of: acme-application
    app.openshift.io/runtime: nginx
    app.openshift.io/runtime-namespace: {{ .Values.namespacePermissions.user }}-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: acme-application
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: acme-application
        deployment: acme-application
    spec:
      containers:
        - name: acme-application
          image: quay.io/open-tech-quest/openshift-nginx-demo-app/error:20261110T16223
          ports:
            - containerPort: 8080
              protocol: TCP
          resources: {}
          imagePullPolicy: Always
          resources:
            limits:
              cpu: "1000m"
              memory: "256M"
            requests:
              cpu: "500m"
              memory: "100M"
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
      imagePullSecrets: []
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
