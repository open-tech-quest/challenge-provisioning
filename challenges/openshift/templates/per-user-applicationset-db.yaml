{{- if .Values.multi_user }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: per-user-db
  namespace: openshift-gitops
spec:
  generators:
  - list:
      elements:
{{- range .Values.multi_user.users }}
      - user: {{ .username | quote }}
{{- end }}
  template:
    metadata:
      name: "{{`{{ user }}`}}-db"
      namespace: openshift-gitops
      finalizers:
      - resources-finalizer.argocd.argoproj.io
    spec:
      destination:
        namespace: "{{`{{ user }}`}}-db"
        server: 'https://kubernetes.default.svc'
      project: default
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
        automated:
          prune: false
          selfHeal: false
      source:
        repoURL: {{ .Values.gitops.repoURL }}
        targetRevision: {{ .Values.gitops.revision }}
        path: challenges/openshift/per-user/db
        helm:
          values: |
            namespacePermissions:
              user: "{{`{{ user }}`}}"
              role: admin
{{- end }}
