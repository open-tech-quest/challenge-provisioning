apiVersion: data-protection.isf.ibm.com/v1alpha1
kind: BackupPolicy
metadata:
  name: otq-production-backuppolicy
spec:
  backupStorageLocation: otq-backuplocation/otq-backuplocation
  provider: isf-backup-restore
  retention:
    number: 30
    unit: days
  schedule:
    cron: '30 10 * * *'
    timezone: Europe/Berlin
    windowEndTime: '14:30'